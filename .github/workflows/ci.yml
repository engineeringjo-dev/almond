name: CI

# THE GATE. Until this file existed there were 506 tests and nothing that ran
# them (there are now ~900 plus an E2E suite): both workflows in this directory deploy, neither verifies. A suite
# nobody runs is documentation with a test runner attached.
#
# It runs on every push and every pull request, including to the release branch,
# because the failure this catches is a merge that was green in isolation and
# red once combined.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One source for the version — the same file the deploy workflows
          # read. They used to say 20 and 22, which is where "works on my
          # machine" begins.
          node-version-file: '.nvmrc'
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly the lockfile, so a
      # transitive bump cannot turn a green CI red (or, worse, a red one green)
      # without a commit that shows it.
      - name: Install
        run: npm ci

      # Zero warnings, whole repo, one config (eslint.config.mjs). Before it
      # there was no ESLint at all; its first run found a real crash — a hook
      # after an early return on the app's Rewards tab.
      - name: Lint (whole repo, zero warnings)
        run: npm run lint

      # Types first: it is the fastest check and the one most likely to fail,
      # so a broken signature costs seconds rather than the whole suite.
      - name: Typecheck (shared, website, bff, app)
        run: npm run typecheck

      - name: Test — BFF (loyalty rules, money, security)
        run: npm test --workspace @almond/bff

      - name: Test — app (earn parity, copy, POS QR)
        run: npm test --workspace almond-app

      - name: Test — website (admin session, webhooks, money seams, i18n parity)
        run: npm test --workspace almond-web

      # A real check on its own: it type-checks every page, resolves every
      # import and renders the static routes.
      - name: Build — website
        run: npm run web:build

      # The customer's journeys in a real browser, on a phone and a desktop:
      # menu → cart → checkout, Arabic RTL and English LTR, WCAG AA (axe fails
      # the run on any serious or critical violation), no horizontal scroll,
      # and the admin key absent from every byte the browser receives.
      # Playwright builds and starts its own website + BFF (playwright.config.ts).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test — E2E + accessibility + RTL (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
