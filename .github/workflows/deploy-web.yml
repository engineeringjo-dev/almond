name: Deploy web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: almond-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Export web build
        run: npx expo export --platform web
      - name: SPA + Pages fixes
        run: |
          # Inject viewport-fit=cover into the INITIAL HTML so Android browsers
          # draw edge-to-edge and expose env(safe-area-inset-*); this is what
          # makes the bottom tab bar clear the system nav bar. Must be in the
          # served HTML (output:single ignores +html.tsx, and a runtime JS meta
          # change is not honoured by Chrome for edge-to-edge).
          if ! grep -q "viewport-fit=cover" dist/index.html; then
            sed -i 's/name="viewport" content="\([^"]*\)"/name="viewport" content="\1, viewport-fit=cover"/' dist/index.html
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: almond-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
